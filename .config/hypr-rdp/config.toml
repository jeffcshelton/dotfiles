# hypr-rdp server settings (see nix/modules/rdp.nix).

bind = "0.0.0.0:3389"

# Sign in with the desktop user's Linux password.
auth_mode = "pam"

fps = 60

# Mirror the physical monitor. Without this, a headless output sized to the
# client is created, and Hyprland gives it a workspace of its own.
output = "HDMI-A-1"
